name: Check D1 Users

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check users
        run: |
          npx wrangler d1 execute iqtf-db \
            --remote \
            --command "SELECT id, email, name, role, CASE WHEN password_hash IS NULL OR password_hash = '' THEN 'MISSING' ELSE 'PRESENT' END AS password_status, created_at FROM users WHERE email = 'traderfun45@gmail.com';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
