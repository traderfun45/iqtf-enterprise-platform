name: Check IQTF D1 CME GC

on:
  workflow_dispatch:

jobs:
  check-cme-gc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check D1 CME GC
        working-directory: cloudflare-api
        run: |
          npx wrangler d1 execute iqtf-db \
            --remote \
            --config wrangler.jsonc \
            --command="SELECT id, symbol, data_date, data_time, settlement_price, volume, open_interest, oi_change, input_method FROM cme_market_data WHERE symbol = 'GC' ORDER BY data_date DESC, data_time DESC, id DESC LIMIT 20;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
