name: Check IQTF D1 Markets

on:
  workflow_dispatch:

jobs:
  check-markets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check D1 markets
        working-directory: cloudflare-api
        run: |
          npx wrangler d1 execute iqtf-db \
            --remote \
            --config wrangler.jsonc \
            --command="SELECT id, symbol, name, provider FROM markets ORDER BY id;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
