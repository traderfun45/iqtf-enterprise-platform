services:
  - type: web
    name: iqtf-enterprise-api
    runtime: node
    buildCommand: npm install && npm run api:build
    startCommand: npm run api:start:prod

    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/iqtf.db

    disk:
      name: iqtf-enterprise-data
      mountPath: /var/data
      sizeGB: 1
