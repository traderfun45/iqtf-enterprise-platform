services:
  - type: web
    name: iqtf-enterprise-api
    runtime: node
    buildCommand: npm install && npm run api:build
    startCommand: npm run api:start:prod
Persistent Disk:
      Name: iqtf-data
      Mount Path: /var/data
      Size: 1 GB
    
    envVars:
      - key: NODE_ENV
        value: production
